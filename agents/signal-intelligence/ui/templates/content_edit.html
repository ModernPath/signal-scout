{% extends 'base.html' %}
{% block title %}Edit previous content · SignalScout Intelligence{% endblock %}
{% block content %}<div class="eyebrow">Company context</div><h1>Edit previous content</h1><p>Replacing this item creates a new content version for future analyses.</p><section class="panel narrow"><form action="{{ url_for('edit_content', content_id=item.id) }}" method="post" class="stack-form"><label>Title<input name="title" required value="{{ item.title }}"></label><label>Text<textarea name="text" required>{{ item.text }}</textarea></label><label>Channel<input name="channel" required value="{{ item.channel }}"></label><label>Source URL<input name="url" type="url" value="{{ item.url or '' }}"></label><div class="actions"><button class="button" type="submit">Save replacement</button><a class="button secondary" href="{{ url_for('index') }}#context">Cancel</a></div></form></section>{% endblock %}
