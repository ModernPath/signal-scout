<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Example Agent{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #646d7e;
      --border: #e2e5ea; --accent: #3b5bdb; --accent-text: #ffffff;
      --success-bg: #e6f4ea; --success-text: #1e6b34;
      --error-bg: #fdecea; --error-text: #8a1f11;
      --summary-bg: #eef2ff; --summary-text: #27348b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171d; --card: #1d2129; --text: #e6e9ef; --muted: #9aa3b2;
        --border: #2d333e; --accent: #748ffc; --accent-text: #0e1116;
        --success-bg: #173222; --success-text: #8fd6a4;
        --error-bg: #3a1a17; --error-text: #f2a79c;
        --summary-bg: #1f2547; --summary-text: #bac8ff;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; align-items: center; gap: 1.5rem; padding: .9rem 1.5rem; background: var(--card); border-bottom: 1px solid var(--border); }
    header strong { font-size: 1.05rem; }
    header nav a { color: var(--muted); text-decoration: none; margin-right: 1rem; }
    header nav a.active, header nav a:hover { color: var(--accent); }
    .mode { margin-left: auto; font-size: .8rem; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: .15rem .6rem; }
    main { max-width: 880px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    h1 { margin: 0 0 1rem; font-size: 1.6rem; }
    h2 { margin: 0 0 .75rem; font-size: 1.1rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem 1.25rem; margin-bottom: 1rem; }
    .muted { color: var(--muted); }
    .flash { padding: .7rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .flash.success { background: var(--success-bg); color: var(--success-text); }
    .flash.error { background: var(--error-bg); color: var(--error-text); }
    .flash.summary { background: var(--summary-bg); color: var(--summary-text); }
    label { display: block; font-weight: 600; font-size: .9rem; margin: .6rem 0 .25rem; }
    input, textarea, button { font: inherit; color: inherit; }
    input, textarea { width: 100%; padding: .5rem .7rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
    textarea { min-height: 4.5rem; resize: vertical; }
    button { padding: .5rem 1rem; border: none; border-radius: 8px; background: var(--accent); color: var(--accent-text); cursor: pointer; }
    button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    button:disabled { opacity: .6; cursor: default; }
    .row { display: flex; gap: .6rem; align-items: center; }
    .row > input { flex: 1; }
    .tag { display: inline-block; font-size: .8rem; padding: .05rem .5rem; margin: 0 .25rem .25rem 0; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); text-decoration: none; }
    a.tag.active, a.tag:hover { border-color: var(--accent); color: var(--accent); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <strong>Example Agent</strong>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Notes</a>
      <a href="{{ url_for('chat_page') }}" class="{{ 'active' if request.endpoint == 'chat_page' }}">Chat</a>
    </nav>
    <span class="mode" title="LLM used by chat and summaries">{{ llm_mode }}</span>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
